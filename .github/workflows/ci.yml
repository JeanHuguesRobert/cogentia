name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm test
          node scripts/check-dependency-janus.js
          node scripts/check-agent-jhn-dependency-step.js
          node scripts/check-mcp-dependency-janus.js
          node scripts/check-calculette-bootstrap.js
          node scripts/check-calculette-janus-seed.js
          node scripts/check-calculette-registry-prefill.js
          node scripts/check-calculette-continuation-import.js
          node scripts/calculette-janus-bootstrap.js --as-of 2026-10-09T23:00:00Z > /dev/null
